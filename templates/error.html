{% extends "base.html" %}

{% block title %}Something went wrong — Statistical Model Suggester{% endblock %}

{% block extra_css %}
<style>
.error-state { max-width: 720px; margin: 4rem auto; padding: clamp(2rem, 6vw, 4rem); text-align: center; background: white; border: 1px solid var(--line); border-radius: 1.5rem; box-shadow: var(--shadow-md); }
.error-icon { display: grid; width: 4rem; height: 4rem; margin: 0 auto 1.3rem; place-items: center; color: #9a5b16; background: #fff5d8; border-radius: 1.1rem; font-size: 1.7rem; }
.error-state p { max-width: 560px; margin: 0 auto 1.6rem; color: var(--muted); }
</style>
{% endblock %}

{% block content %}
<section class="error-state" role="alert">
    <div class="error-icon"><i class="bi bi-exclamation-triangle"></i></div>
    <div class="page-eyebrow">An error occurred</div>
    <h1>We could not complete that request.</h1>
    <p>{{ error }}</p>
    <div class="d-flex flex-wrap justify-content-center gap-2">
        <a href="{{ url_for('main.home') }}" class="btn btn-primary">Return home</a>
        <a href="{{ url_for('main.models_index') }}" class="btn btn-outline-primary">Browse model library</a>
    </div>
</section>
{% endblock %}
